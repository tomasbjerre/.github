name: Update CHANGELOG.md
description: >-
  Checks out master (the caller may currently have a detached checkout of a
  release tag), renders the changelog entry between the previous tag and the
  given tag using git-changelog-command-line, prepends it to CHANGELOG.md, and
  commits and pushes the result to master if anything changed.

inputs:
  tag:
    description: The release tag to generate the changelog entry for.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        ref: master
        fetch-depth: 0
        fetch-tags: true

    - uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Render and prepend changelog entry
      shell: bash
      run: |
        TAG="${{ inputs.tag }}"
        # `|| true` guards against SIGPIPE: head -1 can close the pipe while
        # grep still has output queued, which fails the pipeline under the
        # pipefail shell option even though the value we wanted was captured.
        PREV_TAG=$(git tag --sort=-v:refname | grep -vFx "$TAG" | head -1) || true
        npx git-changelog-command-line \
          ${PREV_TAG:+--from-ref "$PREV_TAG"} \
          --to-ref "$TAG" \
          --prepend-to-file CHANGELOG.md

    - uses: tomasbjerre/.github/.github/actions/git-bot-identity@master

    - name: Commit and push changelog
      shell: bash
      run: |
        if git diff --quiet -- CHANGELOG.md; then
          echo "No changelog changes"
        else
          git add CHANGELOG.md
          git commit -m "chore: updating changelog"
          git push origin master
        fi
