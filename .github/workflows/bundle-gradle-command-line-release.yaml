#
# Reusable release workflow for command-line projects that are built with
# Gradle and published to npm, Maven Central and Docker Hub.
#
# Intended to run when a drafted GitHub Release (see bundle-draft-release.yaml)
# is published, so the release tag already exists - this workflow uses that
# tag as the version, it does not compute or bump its own version.
#
# The `release` gradle task (see gradle-conventions' release.gradle) is a
# GradleBuild meta-task: it spawns a separate nested Gradle invocation that
# does not inherit `-P` properties from the outer command line, it just
# re-reads gradle.properties from disk. So the version has to be written
# into gradle.properties directly, a `-Pversion=` flag has no effect here.
#
# Call it like:
#
# name: Release
#
# on:
#   release:
#     types: [published]
#
# permissions:
#   contents: write
#   id-token: write
#
# jobs:
#   release:
#     uses: tomasbjerre/.github/.github/workflows/bundle-gradle-command-line-release.yaml@master
#     secrets: inherit
#
name: Gradle npm/Maven/Docker Release

on: workflow_call

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Explicit ref: for a `release: published` event, github.ref does
          # not reliably resolve to a proper branch the way it does for
          # workflow_dispatch, which left the checkout unable to push (the
          # commitChangelogTask push failed silently, exit 128, without
          # failing the build).
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          # A PAT (not the default GITHUB_TOKEN) so the changelog commit this
          # workflow pushes still triggers gradle-ci.yaml downstream.
          token: ${{ secrets.RELEASE_PAT }}

      - uses: tomasbjerre/.github/.github/actions/git-bot-identity@master

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26.0.2+10"
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Set version from published release tag
        run: |
          sed -i "s/^version=.*/version=${{ github.event.release.tag_name }}/" gradle.properties
          grep '^version=' gradle.properties

      - name: Publish to npm and Maven Central
        run: ./gradlew release
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signingkey: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Publish to Docker Hub
        run: |
          MAVEN_GROUP=$(grep '^group=' gradle.properties | cut -d= -f2)
          # runnable-jar-to-docker's README-sync step (docker-pushrm) reads this
          # lowercase name directly, mirroring the old local build-docker.sh.
          export dockerhub_token="$DOCKERHUB_TOKEN"
          # The image build/push always runs first and must succeed; a trailing
          # README-sync (docker-pushrm) failure (e.g. token lacks admin scope)
          # is tolerated and doesn't fail the release.
          npx runnable-jar-to-docker@latest \
            --docker-username tomasbjerre \
            --docker-password "$DOCKERHUB_TOKEN" \
            --maven-group "$MAVEN_GROUP" \
            --maven-artifact "${{ github.event.repository.name }}" \
            --maven-version "${{ github.event.release.tag_name }}" \
            --repository-url "file://$HOME/.m2/repository" \
          || echo "runnable-jar-to-docker reported an error (likely the README push) - continuing"
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
