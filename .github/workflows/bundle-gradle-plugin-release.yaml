#
# Reusable release workflow for Gradle projects that publish a Gradle plugin
# to both Maven Central and the Gradle Plugin Portal.
#
# Intended to run when a drafted GitHub Release (see bundle-draft-release.yaml)
# is published, so the release tag already exists - this workflow just checks
# it out, sets the project version to match it, signs and publishes to both
# destinations.
#
# Call it like:
#
# name: Release
#
# on:
#   release:
#     types: [published]
#
# jobs:
#   release:
#     uses: tomasbjerre/.github/.github/workflows/bundle-gradle-plugin-release.yaml@master
#     secrets: inherit
#
name: Gradle Plugin Release

on: workflow_call

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Publish to Maven Central and the Gradle Plugin Portal
        run: |
          ./gradlew -Pversion="${{ github.event.release.tag_name }}" \
            -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" \
            -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET" \
            publishAndReleaseToMavenCentral publishPlugins
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signingkey: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
