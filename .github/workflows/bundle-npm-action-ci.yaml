#
# Reusable CI workflow for npm-based GitHub Actions - TypeScript actions
# that commit their bundled `dist/` output to git, since Actions run the
# exact file tree at the referenced ref; nothing is built at consumption
# time.
#
# Builds the action. If the committed dist/ has drifted from what the
# source actually compiles to (e.g. a dependency-bump PR that never ran
# `npm run build`), this self-heals rather than just failing:
#
# - On a push, or a pull_request from a branch in this same repository
#   (Renovate branches, your own feature branches - anything with write
#   access), it commits the rebuilt dist/ straight back onto that branch.
#   The commit re-triggers this workflow, which then sees no drift and
#   passes - no one has to remember to run `npm run build` locally.
# - On a pull_request from a fork (no push access, and deliberately no
#   auto-committing of derived output from unreviewed code), it fails
#   with a message telling the contributor to run `npm run build` and
#   commit the result themselves.
#
# A real build failure (the source doesn't compile/bundle at all) always
# fails loudly regardless of which case above applies - only the "committed
# dist vs a clean build" diff is self-healing.
#
# This is what makes it safe for bundle-npm-action-release.yaml's floating
# major-version tag to move to any green commit on this repo's default
# branch: green here always means dist/ is actually correct.
#
# A commit pushed with the default GITHUB_TOKEN doesn't trigger a fresh,
# actually-runnable workflow run on a pull_request branch - GitHub creates
# the run but holds it "action_required", needing a human to click approve.
# So the self-heal commit's push authenticates with secrets.RELEASE_PAT
# instead (same reason it's used for the changelog-commit push in the
# release bundles: a PAT-triggered push does trigger a normal run). The
# PAT is only ever used after confirming the branch is a same-repo one -
# it's never exposed to a fork PR's checkout/build/install-script execution.
#
# Call it like:
#
# name: CI
#
# on: [workflow_dispatch, push, pull_request]
#
# permissions:
#   contents: write
#
# jobs:
#   call-workflow:
#     uses: tomasbjerre/.github/.github/workflows/bundle-npm-action-ci.yaml@master
#     secrets: inherit
#
name: Bundle NPM Action CI

# A same-repo PR branch gets both a `push` and a `pull_request: synchronize`
# event for the same commit, so this workflow runs twice in parallel. Both
# runs try to push a self-heal commit to the same branch, and the second
# push loses with a non-fast-forward rejection. Groups both events for the
# same branch into one slot; the newer run cancels the older one instead of
# racing it.
concurrency:
  group: npm-action-ci-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to build with"
        required: false
        default: "24"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install
        shell: bash
        run: npm ci

      - name: Build
        shell: bash
        run: npm run build

      - name: Determine whether this branch can be auto-fixed
        id: fixable
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: tomasbjerre/.github/.github/actions/git-bot-identity@master
        if: steps.fixable.outputs.value == 'true'

      - name: Commit rebuilt dist/ if it drifted
        if: steps.fixable.outputs.value == 'true'
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist/ is already up to date"
            exit 0
          fi
          echo "dist/ was out of date - committing the rebuilt output"
          git add dist
          git commit -m "chore: rebuild dist/"
          branch="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          remote="https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }}.git"
          # actions/checkout leaves a GITHUB_TOKEN credential in
          # http.https://github.com/.extraheader, which silently wins over
          # the PAT embedded in $remote's URL unless removed first - without
          # this, the push still succeeds but is attributed to
          # github-actions[bot] (the GITHUB_TOKEN identity) instead of the
          # PAT's, defeating the whole point of using the PAT here.
          git config --unset-all http.https://github.com/.extraheader || true
          if git push "$remote" HEAD:"$branch"; then
            exit 0
          fi
          # push and pull_request fire together for the same commit on a
          # same-repo branch, so another run can win this race despite the
          # concurrency group above (cancellation isn't instant). Check
          # whether that run already landed the same fix before failing.
          echo "Push rejected - checking whether a concurrent run already fixed dist/"
          git fetch "$remote" "$branch"
          if git diff --quiet FETCH_HEAD -- dist; then
            echo "$branch already has this exact dist/ output (fixed by a concurrent run) - nothing more to do"
            exit 0
          fi
          echo "::error::Failed to push the dist/ fix, and $branch's current dist/ still doesn't match - see the push error above."
          exit 1

      - name: Verify committed dist/ matches build output
        if: steps.fixable.outputs.value == 'false'
        shell: bash
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' locally and commit the result."
            exit 1
          fi
