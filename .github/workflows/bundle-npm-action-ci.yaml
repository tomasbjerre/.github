#
# Reusable CI workflow for npm-based GitHub Actions - TypeScript actions
# that commit their bundled `dist/` output to git, since Actions run the
# exact file tree at the referenced ref; nothing is built at consumption
# time.
#
# This is a pure build smoke test: it only verifies the source actually
# compiles/bundles. It does not check whether the committed dist/ matches
# a fresh build, and it never commits or pushes anything - identical
# behavior for a pull_request (including from a fork) and a push, no
# auth/permissions of any kind needed.
#
# Keeping dist/ correct is bundle-npm-action-draft-release.yaml's job: it
# runs on push to the default branch, rebuilds dist/, and commits it if it
# drifted, before drafting the release. That's also what makes a published
# release's tag trustworthy - by the time a release is drafted from a
# given commit, that commit's dist/ is already known-correct.
#
# Call it like:
#
# name: CI
#
# on: [workflow_dispatch, push, pull_request]
#
# jobs:
#   call-workflow:
#     uses: tomasbjerre/.github/.github/workflows/bundle-npm-action-ci.yaml@master
#
name: Bundle NPM Action CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to build with"
        required: false
        default: "24"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install
        shell: bash
        run: npm ci

      - name: Build
        shell: bash
        run: npm run build

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tomasbjerre/.github/.github/actions/workflow-linter@master
