name: NPM CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to test against"
        required: false
        default: "24"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Node ${{ inputs.node-version }} (ubuntu-latest)
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install
        shell: bash
        run: npm ci

      - name: Build
        shell: bash
        run: npm run build

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workflow-linter
