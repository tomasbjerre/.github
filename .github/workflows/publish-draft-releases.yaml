name: Publish pending draft releases

on:
  schedule:
    - cron: "0 0 2 * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
      MAX_PUBLISH: 100

    steps:
      - name: Publish pending draft releases
        shell: bash
        run: |
          repos=$(gh api users/tomasbjerre/repos --paginate --jq '.[].name')
          published=0
          checked=0

          for repo in $repos; do
            if [ "$published" -ge "$MAX_PUBLISH" ]; then
              echo "Limit reached: $MAX_PUBLISH releases"
              break
            fi

            checked=$((checked + 1))

            draft_id=$(gh api "repos/tomasbjerre/$repo/releases" \
              --paginate \
              --jq '[.[] | select(.draft == true)] | .[0].id // empty')

            if [ -z "$draft_id" ]; then
              continue
            fi

            echo "Publishing: $repo (release $draft_id)"

            gh api --method PATCH "repos/tomasbjerre/$repo/releases/$draft_id" \
              -f draft=false >/dev/null

            gh api --method PATCH "repos/tomasbjerre/$repo/releases/$draft_id" \
              -f make_latest=true >/dev/null

            published=$((published + 1))

            sleep 60
          done

          echo ""
          echo "Done: published $published release(s), checked $checked public repo(s)."
