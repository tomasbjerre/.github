#
# Single point of control for how often pending draft releases get
# published across all repos. Change the cron below to change the interval
# for every repo at once - nothing else needs editing.
#
name: Publish pending draft releases

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - name: Publish any pending draft releases
        shell: bash
        run: |
          repos=$(gh api users/tomasbjerre/repos --paginate --jq '.[].name')
          for repo in $repos; do
            echo "=== tomasbjerre/$repo ==="
            draft_id=$(gh api "repos/tomasbjerre/$repo/releases" --jq '[.[] | select(.draft==true)] | .[0].id // empty')
            if [ -z "$draft_id" ]; then
              echo "No draft release pending"
              continue
            fi
            echo "Publishing draft release id=$draft_id"
            gh api --method PATCH "repos/tomasbjerre/$repo/releases/$draft_id" -f draft=false -f make_latest=true
          done
