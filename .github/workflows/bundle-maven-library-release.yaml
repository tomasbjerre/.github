#
# Reusable release workflow for Maven projects that publish only to Maven
# Central.
#
# Intended to run when a drafted GitHub Release (see bundle-draft-release.yaml)
# is published, so the release tag already exists - this workflow just checks
# it out, sets the project version to match it, signs and deploys.
#
# Call it like:
#
# name: Release
#
# on:
#   release:
#     types: [published]
#
# jobs:
#   release:
#     uses: tomasbjerre/.github/.github/workflows/bundle-maven-library-release.yaml@master
#     secrets: inherit
#
name: Maven Library Release

on: workflow_call

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          server-id: ossrh
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Set release version
        run: |
          ./mvnw -B versions:set \
            -DnewVersion="${{ github.event.release.tag_name }}" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true

      - name: Deploy to Maven Central
        run: ./mvnw -B -Prelease-sign-artifacts deploy -Dgpg.passphrase="$GPG_SIGNING_PASSWORD"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          GPG_TTY: /dev/tty

      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Update CHANGELOG.md
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -vFx "$TAG" | head -1)
          npx git-changelog-command-line \
            ${PREV_TAG:+--from-ref "$PREV_TAG"} \
            --to-ref "$TAG" \
            --prepend-to-file CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes"
          else
            git add CHANGELOG.md
            git commit -m "chore: updating changelog"
            git push origin master
          fi
