#
# Draft-release workflow for npm-based GitHub Actions (see
# bundle-npm-action-ci.yaml for the CI half, which only checks that the
# source builds and never touches dist/).
#
# Runs on push to the default branch. Rebuilds dist/ and, if it drifted
# from what's committed, commits and pushes the fix, then drafts/updates
# the GitHub Release from commit history, same as the generic
# bundle-draft-release.yaml.
#
# The commit push authenticates with secrets.RELEASE_PAT rather than the
# default GITHUB_TOKEN: on a branch with required-status-checks protection,
# GITHUB_TOKEN has no bypass privilege and the push is rejected outright
# (GH006) since the brand new commit hasn't had a chance to gain a passing
# check yet. A PAT belonging to a user with bypass permission (the same
# reason it's used for the changelog-commit push in the Gradle/Maven
# release bundles) can push straight through.
#
# This is what makes a later "publish this release" step trustworthy with
# no further automation needed: by the time a release is drafted from a
# given commit, that commit's dist/ is already known-correct, so the
# resulting tag is safe for consumers to use directly (uses: owner/repo@X.Y.Z).
#
# Call it like (the push trigger MUST be scoped to the default branch only -
# an unscoped `push` fires on every branch, including PR/dependency-bot
# branches, pushing dist/ commits and regenerating the draft release
# description from whatever branch happened to push most recently):
#
# name: Draft release
#
# on:
#   push:
#     branches: [main]
#   workflow_dispatch: {}
#
# permissions:
#   contents: write
#
# jobs:
#   call-workflow:
#     uses: tomasbjerre/.github/.github/workflows/bundle-npm-action-draft-release.yaml@master
#     secrets: inherit
#
name: Bundle NPM Action Draft Release

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to build with"
        required: false
        default: "24"
        type: string

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install
        shell: bash
        run: npm ci

      - name: Build
        shell: bash
        run: npm run build

      - uses: tomasbjerre/.github/.github/actions/git-bot-identity@master

      - name: Commit rebuilt dist/ if it drifted
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist/ is already up to date"
            exit 0
          fi
          echo "dist/ was out of date - committing the rebuilt output"
          git add dist
          git commit -m "chore: rebuild dist/"
          # Same mechanism actions/checkout itself uses for its `token:`
          # input (Basic auth via a one-off http.extraheader, scoped to
          # just this git invocation via -c) - a URL-embedded credential
          # is rejected outright by GitHub for this token.
          auth="$(printf 'x-access-token:%s' '${{ secrets.RELEASE_PAT }}' | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:"${{ github.ref_name }}"

      - uses: tomasbjerre/.github/.github/actions/publish-github-release@master
        with:
          draft: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
