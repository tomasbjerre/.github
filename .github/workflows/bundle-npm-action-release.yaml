#
# Reusable release workflow for npm-based GitHub Actions (see
# bundle-npm-action-ci.yaml for the CI half).
#
# GitHub Actions convention is a floating major-version tag (e.g. v1) that
# consumers pin to (uses: owner/repo@v1) and that always points at the
# latest release of that major version. This workflow force-moves that tag
# to the commit a GitHub Release was just published for.
#
# Doesn't rebuild anything - bundle-npm-action-ci.yaml's dist-drift check
# already guarantees the tagged commit's committed dist/ is correct.
#
# Intended to run when a drafted GitHub Release (see bundle-draft-release.yaml)
# is published, so the release tag already exists - this workflow uses that
# tag as-is, it does not compute or bump its own version.
#
# Call it like:
#
# name: Release
#
# on:
#   release:
#     types: [published]
#
# permissions:
#   contents: write
#
# jobs:
#   release:
#     uses: tomasbjerre/.github/.github/workflows/bundle-npm-action-release.yaml@master
#
name: NPM Action Release

on: workflow_call

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: tomasbjerre/.github/.github/actions/git-bot-identity@master

      - name: Move floating major-version tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MAJOR="v$(echo "$TAG" | sed 's/^v//' | cut -d. -f1)"
          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push origin "$MAJOR" --force
