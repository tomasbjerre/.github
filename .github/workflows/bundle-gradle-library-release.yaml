#
# Reusable release workflow for Gradle projects that publish only to Maven
# Central.
#
# Intended to run when a drafted GitHub Release (see bundle-draft-release.yaml)
# is published, so the release tag already exists - this workflow just checks
# it out, sets the project version to match it, signs and publishes.
#
# Call it like:
#
# name: Release
#
# on:
#   release:
#     types: [published]
#
# jobs:
#   release:
#     uses: tomasbjerre/.github/.github/workflows/bundle-gradle-library-release.yaml@master
#     secrets: inherit
#
name: Gradle Library Release

on: workflow_call

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Publish to Maven Central
        run: ./gradlew -Pversion="${{ github.event.release.tag_name }}" publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signingkey: ${{ secrets.GPG_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Update CHANGELOG.md
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -vFx "$TAG" | head -1)
          npx git-changelog-command-line \
            ${PREV_TAG:+--from-ref "$PREV_TAG"} \
            --to-ref "$TAG" \
            --prepend-to-file CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes"
          else
            git add CHANGELOG.md
            git commit -m "chore: updating changelog"
            git push origin master
          fi
