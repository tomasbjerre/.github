# Call it with node-version like:
#
# jobs:
#  call-ci:
#    uses: tomasbjerre/.github/.github/workflows/bundle-npm-ci.yaml@master
#    with:
#      node-version: '22'
#
#
name: Bundle NPM CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to test against"
        required: false
        default: "24"
        type: string

jobs:
  call-npm-ci:
    uses: tomasbjerre/.github/.github/workflows/npm-ci.yaml@master
    with:
      node-version: ${{ inputs.node-version }}
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: tomasbjerre/.github/.github/workflows/publish-release-on-tag-push.yaml@master
    secrets: inherit
