name: Fix failing Renovate PRs

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  fix-renovate-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_REPO_TOKEN }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            Authenticate first: `gh auth login --with-token <<< "$GH_REPO_TOKEN"` then `gh auth setup-git` so `git push` uses it too.

            Across every repo owned by `${{ github.repository_owner }}`, find open Renovate pull requests with failing CI checks. For each one: check out its existing branch (not a new one), diagnose the failure (lockfile drift, a breaking API change from the bump, stale snapshots, etc.), and push a minimal, verified fix straight to that branch with a Conventional Commits message. If you can't confidently fix it, leave a PR comment explaining why instead of guessing.

            Never force-push, close PRs, rename/delete branches, or touch anything but the renovate branch itself. Finish with a short summary of what was fixed vs. commented on.
