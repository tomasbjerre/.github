name: Maven CI

on:
  workflow_call:
    inputs:
      java-versions:
        description: "Java versions to test against"
        required: false
        default: '["17", "21", "25"]'
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java-versions) }}
        os: ["ubuntu-latest"]
    name: Java ${{ matrix.java }} (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v7

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Maven build
        shell: bash
        run: |
          java -version
          ./mvnw --no-transfer-progress --batch-mode verify
